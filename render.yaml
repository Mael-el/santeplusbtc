services:
  - type: web
    name: santeplus-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: santeplus-postgres
          property: connectionString
      - key: POSTGRES_PASSWORD
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://santeplus-api.onrender.com
      - key: PINATA_API_KEY
        sync: false
      - key: PINATA_SECRET_API_KEY
        sync: false
      - key: LIGHTNING_PROVIDER
        value: lnbits
      - key: LNBITS_API_KEY
        sync: false
      - key: FIAT_PROVIDER
        value: fedapay
      - key: FEDAPAY_SECRET_KEY
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: INITIAL_DIRECTOR_PASSWORD
        sync: false
      - key: INITIAL_DOCTOR_PASSWORD
        sync: false

databases:
  - name: santeplus-postgres
    plan: free